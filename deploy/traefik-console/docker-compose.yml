# Traefik Console + a new Traefik.
#
# First time only, in this folder:
#   mkdir -p config/traefik/acme data/logs data/plugins data/console
# Then:
#   docker compose up -d
#   docker compose logs console | grep TCS-   # the one-time setup token
#
# Open http://localhost:8081, paste the setup token and create the administrator.
# Console creates its own folders (dynamic/, secrets/, its state) and its route on first start.
# Change the example values to yours (console.example.com, user 1000:1000).
# Lines starting with # are optional settings shown with their default: remove the # to use one.
name: traefik-console

services:
  traefik:
    image: traefik:v3.7.20
    command: ["--configFile=/etc/traefik/static/traefik.yml"]
    user: "1000:1000"   # owner of ./config and ./data (see `id -u` and `id -g`); same as console below
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    environment:
      CONSOLE_HOST: console.example.com   # routes this address to Console (config/traefik/dynamic/management.yml); same as console below
    env_file: ./config/traefik/dns-providers.env   # DNS provider variables for certificate resolvers; Console keeps this file
    ports:
      - "80:8000"     # HTTP  (use "127.0.0.1:80:8000" to keep it private to this machine)
      - "443:8443"    # HTTPS (use "127.0.0.1:443:8443" to keep it private to this machine)
    volumes:
      - ./config/traefik:/etc/traefik:ro
      - ./config/traefik/acme:/etc/traefik/acme
      - ./data/logs:/logs
      - ./data/plugins:/plugins-storage
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--configFile=/etc/traefik/static/traefik.yml", "--ping"]
      interval: 3s
      timeout: 2s
      retries: 15

  console:
    image: ghcr.io/fouad-aniq/traefik-console:latest
    depends_on: {traefik: {condition: service_healthy}}
    entrypoint: ["/bin/sh", "-ec", "server preflight && exec server"]
    user: "1000:1000"   # same as traefik above
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:8081:8081"   # direct access from this machine, also a way back in if a route breaks
    environment:
      # --- Address and sign-in ---
      CONSOLE_HOST: console.example.com                     # same as traefik above; the address you open Console at through Traefik
      # CONSOLE_UPSTREAM: http://console:8081              # how Traefik reaches Console, for the route Console creates for itself
      # COOKIE_SECURE: "true"                               # force Secure sign-in cookies on or off (default: on when the page is served over HTTPS)
      # TRUSTED_PROXIES: 172.16.0.0/12                      # proxies trusted for the client IP in sign-in limits and the activity log (default: none)
      # SESSION_IDLE_MINUTES: "120"                         # sign out after this much inactivity (5-10080)
      # SESSION_MAX_HOURS: "24"                             # sign out after this long in any case (1-720)

      # --- Traefik ---
      TRAEFIK_API_URL: http://traefik:8080                  # Traefik's API (needs `api: {}`)
      TRAEFIK_PROBE_TARGETS: websecure=traefik:8443         # where Domains > Check connects to see the certificate Traefik serves
      # TRAEFIK_CONVERGENCE_TIMEOUT_SEC: "15"               # how long to wait for Traefik to load a change (max 60)
      # STATIC_FILE: /config/static/traefik.yml             # traefik.yml, inside the config folder mounted at /config
      # DYNAMIC_DIR: /config/dynamic                        # the watched folder inside Console ...
      # TRAEFIK_DYNAMIC_DIR: /etc/traefik/dynamic           # ... and inside Traefik (must equal providers.file.directory)
      # SECRETS_DIR: /config/secrets                        # the secrets folder inside Console ...
      # TRAEFIK_SECRETS_DIR: /etc/traefik/secrets           # ... and inside Traefik
      # ACME_DIR: /config/acme                              # the Let's Encrypt (acme) folder inside Console ...
      # TRAEFIK_ACME_DIR: /etc/traefik/acme                 # ... and inside Traefik (where resolvers store their files)

      # --- Docker: lets Console restart Traefik and create CrowdSec keys ---
      # DOCKER_HOST: tcp://socket-proxy:2375                # socket-proxy (or unix:///var/run/docker.sock with the socket mounted)
      # TRAEFIK_CONTAINER: traefik                          # Traefik's container name
      # CROWDSEC_CONTAINER: crowdsec                        # CrowdSec's container name
      # ALLOW_TRAEFIK_RESTART: "true"                       # let Console restart Traefik after static changes

      # --- CrowdSec ---
      # CROWDSEC_LAPI_URL: http://crowdsec:8080             # CrowdSec's Local API
      # CROWDSEC_API_KEY: ""                                # an existing bouncer key (default: Console creates one)
      # CROWDSEC_MACHINE_ID: ""                             # an existing machine account for alerts and decisions (default: Console creates one)
      # CROWDSEC_MACHINE_PASSWORD: ""                       # password of that machine account
      # CROWDSEC_CA_CERT: ""                                # private CA file, for a Local API over HTTPS
      # CROWDSEC_CLIENT_CERT: ""                            # client certificate file, for a Local API that requires one
      # CROWDSEC_CLIENT_KEY: ""                             # key file of that client certificate
      # CROWDSEC_BOUNCER_CERT: ""                           # bouncer certificate file (mTLS instead of a bouncer key)
      # CROWDSEC_BOUNCER_KEY: ""                            # key file of the bouncer certificate
      # CROWDSEC_MACHINE_CERT: ""                           # machine certificate file (mTLS instead of a machine password)
      # CROWDSEC_MACHINE_KEY: ""                            # key file of the machine certificate
      # CROWDSEC_APPSEC_URL: ""                             # AppSec (WAF) endpoint, if you enable AppSec
      # CROWDSEC_METRICS_URL: ""                            # CrowdSec metrics endpoint, to show measured ingestion
      # CROWDSEC_METRICS_TOKEN: ""                          # bearer token for that metrics endpoint, if it needs one
      # CROWDSEC_ACCESS_LOG_SOURCE: ""                      # acquisition source label that confirms Traefik's log is being read
      # CROWDSEC_READ_TIMEOUT: "20"                         # seconds (1-120)
      # CROWDSEC_ALERT_LIMIT: "500"                         # most alerts read at once (1-1000)
      # CROWDSEC_PROTECTED_CIDRS: 127.0.0.0/8,::1/128       # networks that can never be banned from Console

      # --- History and storage ---
      # SNAPSHOT_RETENTION_AUTO: "20"                       # automatic snapshots kept (0-1000)
      # AUTO_SNAPSHOT_BEFORE_STATIC: "false"                # also take a snapshot before every static change
      # UPDATE_CHECK: "true"                                # show when a newer Console release is out (asks GitHub)
      # OPERATION_HISTORY_DAYS: "90"                        # days the operations log is kept (1-3650)
      # MAX_JOURNAL_BYTES: "536870912"                      # space for the change journal (512 MiB)
      # MAX_SNAPSHOT_BYTES: "1073741824"                    # space for snapshots (1 GiB)
    volumes:
      - ./data/console:/var/lib/console
      - ./config/traefik:/config
    logging:
      options: {max-size: "10m", max-file: "3"}
